<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Maria's Homestay | Private Resort in Santa Maria, Bulacan</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f5ef;
      color: #25352c;
    }

    header {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 30px;
    }

    .hero {
      max-width: 750px;
    }

    .eyebrow {
      text-transform: uppercase;
      letter-spacing: 3px;
      font-size: 13px;
      margin-bottom: 20px;
    }

    h1 {
      font-size: clamp(45px, 8vw, 80px);
      line-height: 0.95;
      margin-bottom: 25px;
    }

    p {
      font-size: 18px;
      line-height: 1.7;
      margin-bottom: 30px;
    }

    .button {
      display: inline-block;
      background: #25352c;
      color: white;
      padding: 16px 28px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
    }

    .status {
      margin-top: 50px;
      font-size: 14px;
      opacity: 0.65;
    }
  </style>
</head>

<body>

<header>
  <div class="hero">

    <div class="eyebrow">
      Santa Maria, Bulacan
    </div>

    <h1>
      Maria's<br>
      Homestay
    </h1>

    <p>
      Your private place to swim, stay, celebrate
      and reconnect with the people who matter.
    </p>

    <a class="button" href="#">
      Explore Maria's Homestay
    </a>

    <div class="status">
      Official website • Coming together soon
    </div>

  </div>
</header>

</body>
</html>
